spring:
  datasource:
    url: jdbc:h2:mem:forexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false
    # LocalDateTime -> "2026-04-22T10:01:00" 형식으로 직렬화
    # write-dates-as-timestamps: false 만으로 ISO-8601 포맷 활성화됨
    # 기본값은 [2026,4,22,10,1,0] 배열이라 API 응답이 깨지므로 반드시 설정 필요

# 외부 환율 API (open.er-api.com: API 키 불필요, 무료)
forex:
  api:
    base-url: https://open.er-api.com/v6/latest
    use-mock-fallback: true

server:
  port: 8080

logging:
  level:
    com.switchwon: DEBUG
    org.springframework.scheduling: DEBUG
