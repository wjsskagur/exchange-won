spring:
  datasource:
    url: jdbc:h2:mem:forexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false
    # LocalDateTime 직렬화 포맷은 각 DTO의 @JsonFormat(pattern = "yyyy-MM-dd'T'HH:mm:ss")으로 제어

# 외부 환율 API (open.er-api.com: API 키 불필요, 무료)
forex:
  api:
    base-url: https://open.er-api.com/v6/latest
    use-mock-fallback: true

server:
  port: 8080

logging:
  level:
    com.switchwon: DEBUG
    org.springframework.scheduling: DEBUG
